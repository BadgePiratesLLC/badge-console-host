name: release

# Builds a single-file executable per OS on a real runner for that OS —
# this is how a Windows/Linux binary gets produced at all, since the dev
# environment this repo was first built in is macOS-only. See
# docs/DECISIONS.md "Single-executable packaging" for what has and hasn't
# been verified.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: badge-console-host-macos
            bin: badge-console-host
          - os: ubuntu-latest
            artifact: badge-console-host-linux
            bin: badge-console-host
          - os: windows-latest
            artifact: badge-console-host-windows
            bin: badge-console-host.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-sea.mjs
      # `node scripts/build-sea.mjs` exiting 0 only proves the build step
      # ran; it does not prove the resulting binary actually starts. Both
      # v0.1.1 and v0.1.2 passed this job and still shipped a release exe
      # that crashed on first launch (Nexus bcae3a08) — this step runs the
      # literal artifact this job is about to upload and hits it over HTTP
      # the way a real buyer's browser would.
      - run: node scripts/sea-smoke.mjs dist/${{ matrix.bin }}
      - run: node --test
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.bin }}

  # install.sh / install.ps1 both fetch from releases/<repo>/latest/download/<asset> —
  # a URL that only resolves once a GitHub Release exists with matching asset
  # names attached. Without this job, every build here was a CI artifact only
  # (auth-required, no stable URL) and the one-line installers had nothing to
  # download — confirmed missing on this workflow's first-ever run (no tags,
  # no releases existed until this was added). Gated to real tag pushes so a
  # manual workflow_dispatch (used to smoke-test the build matrix) never cuts
  # a release by accident.
  publish-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage release assets under the names install.sh / install.ps1 expect
        run: |
          mkdir -p release
          cp artifacts/badge-console-host-macos/badge-console-host release/badge-console-host-macos
          cp artifacts/badge-console-host-linux/badge-console-host release/badge-console-host-linux
          cp artifacts/badge-console-host-windows/badge-console-host.exe release/badge-console-host-windows.exe
          chmod +x release/badge-console-host-macos release/badge-console-host-linux
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
